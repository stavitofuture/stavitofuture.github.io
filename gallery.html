<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fotogalerie | STAVITO FUTURE</title>

    name="description"
    content="Fotogalerie realizací a pracovního procesu společnosti STAVITO FUTURE."

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>

    /* =========================================
       ZÁKLAD
    ========================================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top left,
          rgba(59,130,246,.08),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #eef4ff 0%,
          #f8fbff 100%
        );
      color:#0f172a;
      line-height:1.6;
      min-height:100vh;
      overflow-x:hidden;
    }

    body.no-scroll{
      overflow:hidden;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      display:block;
      max-width:100%;
    }

    button{
      font-family:inherit;
    }

    .container{
      width:min(1410px, calc(100% - 40px));
      margin:0 auto;
    }


    /* =========================================
       HEADER
    ========================================= */

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(24,45,83,.97);
      backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 5px 25px rgba(15,23,42,.08);
    }

    .navbar{
      min-height:78px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:24px;
      padding:10px 0;
    }


    /* =========================================
       LOGO
    ========================================= */

    .brand{
      display:flex;
      align-items:center;
      gap:16px;
      color:#fff;
      font-weight:900;
      font-size:32px;
      letter-spacing:1px;
      white-space:nowrap;
      flex-shrink:0;
    }

    .brand img{
      width:40px;
      height:40px;
      object-fit:contain;
      filter:
        brightness(0)
        invert(1)
        drop-shadow(0 5px 10px rgba(255,255,255,.10));
    }


    /* =========================================
       PRAVÁ ČÁST HEADERU
    ========================================= */

    .nav-right{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:20px;
      margin-left:auto;
    }


    /* =========================================
       MENU
    ========================================= */

    nav{
      display:flex;
      align-items:center;
      gap:25px;
      white-space:nowrap;
    }

    nav a{
      position:relative;
      color:rgba(255,255,255,.92);
      font-size:16px;
      font-weight:800;
      transition:
        color .25s ease,
        transform .25s ease;
    }

    nav a:hover{
      color:#fff;
      transform:translateY(-1px);
    }

    nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-8px;
      width:0;
      height:3px;
      border-radius:20px;
      background:#60a5fa;
      transition:width .25s ease;
    }

    nav a:hover::after{
      width:100%;
    }

    nav a.active{
      color:#93c5fd;
    }

    nav a.active::after{
      width:100%;
    }


    /* =========================================
       JAZYKY
    ========================================= */

    .lang-switcher{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .lang-btn{
      min-height:40px;
      padding:0 14px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.07);
      color:#fff;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      transition:.25s ease;
    }

    .lang-btn:hover{
      background:rgba(255,255,255,.14);
    }

    .lang-btn.active{
      background:#fff;
      color:#1d4ed8;
      border-color:#fff;
    }

    .lang-mobile{
      display:none;
    }


    /* =========================================
       PROSTOR POD MENU
    ========================================= */

    .header-space{
      height:64px;
      background:
        linear-gradient(
          180deg,
          rgba(226,236,253,.55),
          rgba(248,251,255,.20)
        );
    }


    /* =========================================
       HLAVNÍ ČÁST
    ========================================= */

    main{
      padding:72px 0 90px;
    }

    .gallery-heading{
      text-align:center;
      margin-bottom:36px;
    }

    .eyebrow{
      display:inline-block;
      color:#2563eb;
      font-size:15px;
      font-weight:900;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-bottom:10px;
    }

    .gallery-heading h1{
      color:#0f172a;
      font-size:56px;
      line-height:1.05;
      font-weight:900;
      letter-spacing:-1.5px;
      margin-bottom:12px;
    }

    .gallery-heading p{
      color:#53627a;
      font-size:20px;
      max-width:800px;
      margin:0 auto;
    }


    /* =========================================
       GALERIE
    ========================================= */

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:24px;
      align-items:stretch;
    }

    .gallery-item{
      position:relative;
      height:390px;
      overflow:hidden;
      border-radius:28px;
      cursor:pointer;
      background:#dbeafe;
      box-shadow:
        0 18px 45px rgba(15,23,42,.10);
      transition:
        transform .35s ease,
        box-shadow .35s ease;
    }

    .gallery-item:hover{
      transform:translateY(-7px);
      box-shadow:
        0 28px 58px rgba(37,99,235,.18);
    }

    .gallery-item img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:
        transform .75s ease,
        filter .45s ease;
    }

    .gallery-item:hover img{
      transform:scale(1.055);
      filter:brightness(1.04) saturate(1.04);
    }

    .gallery-item::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          transparent 65%,
          rgba(15,23,42,.15)
        );
      pointer-events:none;
      transition:.35s ease;
    }

    .gallery-item:hover::after{
      background:
        linear-gradient(
          180deg,
          transparent 60%,
          rgba(29,78,216,.16)
        );
    }

    .zoom-icon{
      position:absolute;
      z-index:3;
      right:18px;
      bottom:18px;
      width:48px;
      height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:rgba(255,255,255,.94);
      color:#1d4ed8;
      font-size:21px;
      box-shadow:0 10px 25px rgba(15,23,42,.18);
      opacity:0;
      transform:translateY(8px);
      transition:.3s ease;
      pointer-events:none;
    }

    .gallery-item:hover .zoom-icon{
      opacity:1;
      transform:translateY(0);
    }


    /* =========================================
       LIGHTBOX
    ========================================= */

    .lightbox{
      position:fixed;
      inset:0;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:30px;
      background:rgba(3,9,24,.95);
      backdrop-filter:blur(12px);
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:
        opacity .3s ease,
        visibility .3s ease;
    }

    .lightbox.open{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .lightbox-content{
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .lightbox-image{
      max-width:calc(100% - 150px);
      max-height:calc(100vh - 120px);
      width:auto;
      height:auto;
      object-fit:contain;
      border-radius:18px;
      box-shadow:0 30px 80px rgba(0,0,0,.50);
      user-select:none;
    }

    .lightbox-close{
      position:fixed;
      top:22px;
      right:28px;
      z-index:10005;
      width:52px;
      height:52px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.96);
      color:#0f172a;
      font-size:35px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
      transition:.25s ease;
    }

    .lightbox-close:hover{
      transform:scale(1.08);
    }

    .lightbox-arrow{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      z-index:10004;
      width:60px;
      height:60px;
      border:none;
      border-radius:50%;
      background:rgba(255,255,255,.94);
      color:#1d4ed8;
      font-size:42px;
      line-height:1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 14px 34px rgba(0,0,0,.30);
      transition:.25s ease;
    }

    .lightbox-arrow:hover{
      transform:translateY(-50%) scale(1.08);
      background:#fff;
    }

    .lightbox-prev{
      left:28px;
    }

    .lightbox-next{
      right:28px;
    }

    .lightbox-counter{
      position:fixed;
      left:50%;
      bottom:24px;
      transform:translateX(-50%);
      z-index:10004;
      padding:8px 15px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      color:#fff;
      font-size:14px;
      font-weight:800;
      backdrop-filter:blur(10px);
    }


    /* =========================================
       FOOTER
    ========================================= */

    footer{
      background:#081124;
      color:#fff;
      padding:32px 0;
    }

    .footer-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    .footer-brand{
      font-size:22px;
      font-weight:900;
    }

    .footer-small{
      color:rgba(255,255,255,.68);
      font-size:14px;
    }


    /* =========================================
       ANIMACE
    ========================================= */

    .reveal{
      opacity:0;
      transform:translateY(35px);
      transition:
        opacity .75s ease,
        transform .75s ease;
    }

    .reveal.show{
      opacity:1;
      transform:translateY(0);
    }


    /* =========================================
       RESPONSIVE
    ========================================= */

    @media(max-width:1200px){

      .navbar{
        flex-direction:column;
        align-items:center;
        gap:12px;
      }

      .nav-right{
        width:100%;
        justify-content:center;
        margin-left:0;
        flex-wrap:wrap;
      }

      .gallery-grid{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }

      .gallery-item{
        height:380px;
      }
    }


    @media(max-width:850px){

      .header-space{
        height:35px;
      }

      .brand{
        font-size:26px;
      }

      nav{
        gap:14px 18px;
        justify-content:center;
        flex-wrap:wrap;
      }

      nav a{
        font-size:15px;
      }

      main{
        padding-top:55px;
      }

      .gallery-heading h1{
        font-size:45px;
      }

      .gallery-heading p{
        font-size:18px;
      }
    }


    @media(max-width:650px){

      .container{
        width:min(100% - 24px, 1410px);
      }

      header{
        position:relative;
      }

      .navbar{
        padding:14px 0;
      }

      .brand{
        font-size:22px;
      }

      .brand img{
        width:34px;
        height:34px;
      }

      .nav-right{
        flex-direction:column;
        gap:14px;
      }

      nav{
        width:100%;
        gap:12px 15px;
      }

      nav a{
        font-size:14px;
      }

      .lang-switcher{
        width:100%;
        justify-content:center;
      }

      .lang-btn{
        min-width:64px;
        padding:0 10px;
      }

      .lang-desktop{
        display:none;
      }

      .lang-mobile{
        display:inline;
      }

      .header-space{
        height:20px;
      }

      main{
        padding:42px 0 60px;
      }

      .gallery-heading{
        margin-bottom:28px;
      }

      .gallery-heading h1{
        font-size:37px;
        letter-spacing:-1px;
      }

      .gallery-heading p{
        font-size:16px;
      }

      .gallery-grid{
        grid-template-columns:1fr;
        gap:18px;
      }

      .gallery-item{
        height:340px;
        border-radius:22px;
      }

      .zoom-icon{
        opacity:1;
        transform:none;
      }

      .lightbox{
        padding:12px;
      }

      .lightbox-image{
        max-width:100%;
        max-height:calc(100vh - 130px);
        border-radius:12px;
      }

      .lightbox-close{
        top:12px;
        right:12px;
        width:46px;
        height:46px;
        font-size:30px;
      }

      .lightbox-arrow{
        width:46px;
        height:46px;
        font-size:33px;
        background:rgba(255,255,255,.88);
      }

      .lightbox-prev{
        left:10px;
      }

      .lightbox-next{
        right:10px;
      }

      .lightbox-counter{
        bottom:15px;
      }
    }


    @media(max-width:400px){

      .brand{
        font-size:19px;
      }

      nav{
        gap:10px 12px;
      }

      nav a{
        font-size:13px;
      }

      .gallery-heading h1{
        font-size:32px;
      }

      .gallery-item{
        height:290px;
      }
    }

  </style>

</head>

      aria-label="Předchozí fotografie"
    >
      ‹
    </button>


    <!-- FOTOGRAFIE -->

    <div
      class="lightbox-content"
      onclick="event.stopPropagation()"
    >

      <img
        src="gallery1.jpg"
        alt="STAVITO FUTURE fotogalerie"
        class="lightbox-image"
        id="lightboxImage"
      >

    </div>


    <!-- DALŠÍ -->

    <button
      type="button"
      class="lightbox-arrow lightbox-next"
      onclick="changePhoto(1,event)"
      aria-label="Další fotografie"
    >
      ›
    </button>


    <!-- POČÍTADLO -->

    <div
      class="lightbox-counter"
      id="lightboxCounter"
    >
      1 / 12
    </div>

  </div>


  <!-- =========================================
       JAVASCRIPT
  ========================================= -->

  <script>


    /* =========================================
       SEZNAM FOTOGRAFIÍ
    ========================================= */

    const galleryPhotos = [
      "gallery1.jpg",
      "gallery2.jpg",
      "gallery3.jpg",
      "gallery4.jpg",
      "gallery5.jpg",
      "gallery6.jpg",
      "gallery7.jpg",
      "gallery8.jpg",
      "gallery9.jpg",
      "gallery10.jpg",
      "gallery11.jpg",
      "gallery12.jpg"
    ];


    let currentPhoto = 0;


    /* =========================================
       OTEVŘÍT FOTOGRAFII
    ========================================= */

    function openLightbox(index){

      currentPhoto = index;

      updateLightbox();

      const lightbox =
        document.getElementById("lightbox");

      lightbox.classList.add("open");

      lightbox.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.classList.add(
        "no-scroll"
      );

    }


    /* =========================================
       OTEVŘÍT POMOCÍ ENTER / SPACE
    ========================================= */

    function openByKeyboard(event,index){

      if(
        event.key === "Enter" ||
        event.key === " "
      ){

        event.preventDefault();

        openLightbox(index);

      }

    }


    /* =========================================
       ZAVŘÍT
    ========================================= */

    function closeLightbox(event){

      if(event){
        event.stopPropagation();
      }

      const lightbox =
        document.getElementById("lightbox");

      lightbox.classList.remove("open");

      lightbox.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.classList.remove(
        "no-scroll"
      );

    }


    /* =========================================
       KLIKNUTÍ NA TMAVÉ POZADÍ
    ========================================= */

    function closeLightboxFromBackground(event){

      if(
        event.target.id === "lightbox"
      ){

        closeLightbox();

      }

    }


    /* =========================================
       DALŠÍ / PŘEDCHOZÍ
    ========================================= */

    function changePhoto(direction,event){

      if(event){
        event.stopPropagation();
      }

      currentPhoto += direction;


      if(currentPhoto < 0){

        currentPhoto =
          galleryPhotos.length - 1;

      }


      if(
        currentPhoto >=
        galleryPhotos.length
      ){

        currentPhoto = 0;

      }


      updateLightbox();

    }


    /* =========================================
       AKTUALIZACE FOTOGRAFIE
    ========================================= */

    function updateLightbox(){

      const image =
        document.getElementById(
          "lightboxImage"
        );

      const counter =
        document.getElementById(
          "lightboxCounter"
        );


      image.src =
        galleryPhotos[currentPhoto];


      counter.textContent =
        (currentPhoto + 1) +
        " / " +
        galleryPhotos.length;

    }


    /* =========================================
       KLÁVESNICE
    ========================================= */

    document.addEventListener(
      "keydown",
      function(event){

        const lightbox =
          document.getElementById(
            "lightbox"
          );


        if(
          !lightbox.classList.contains(
            "open"
          )
        ){
          return;
        }


        if(event.key === "Escape"){

          closeLightbox();

        }


        if(event.key === "ArrowRight"){

          changePhoto(1);

        }


        if(event.key === "ArrowLeft"){

          changePhoto(-1);

        }

      }
    );


    /* =========================================
       PŘEKLADY
    ========================================= */

    const translations = {


      /* =====================================
         ČEŠTINA
      ===================================== */

      cz:{

        navAbout:"O nás",

        navServices:"Služby",

        navProjects:"Realizace",

        navGallery:"Fotogalerie",

        navContact:"Kontakt",

        galleryEyebrow:"FOTOGALERIE",

        galleryTitle:"Fotogalerie procesu",

        gallerySubtitle:
          "Fotografie z našich realizací a pracovního procesu.",

        footerText:
          "© 2026 STAVITO FUTURE s.r.o. Všechna práva vyhrazena."

      },


      /* =====================================
         ENGLISH
      ===================================== */

      en:{

        navAbout:"About us",

        navServices:"Services",

        navProjects:"Projects",

        navGallery:"Photo gallery",

        navContact:"Contact",

        galleryEyebrow:"PHOTO GALLERY",

        galleryTitle:"Process photo gallery",

        gallerySubtitle:
          "Photos from our projects and work process.",

        footerText:
          "© 2026 STAVITO FUTURE s.r.o. All rights reserved."

      },


      /* =====================================
         SLOVENČINA
      ===================================== */

      sk:{

        navAbout:"O nás",

        navServices:"Služby",

        navProjects:"Realizácie",

        navGallery:"Fotogaléria",

        navContact:"Kontakt",

        galleryEyebrow:"FOTOGALÉRIA",

        galleryTitle:"Fotogaléria procesu",

        gallerySubtitle:
          "Fotografie z našich realizácií a pracovného procesu.",

        footerText:
          "© 2026 STAVITO FUTURE s.r.o. Všetky práva vyhradené."

      }

    };


    /* =========================================
       ZMĚNA JAZYKA
    ========================================= */

    function setLang(lang,button){

      const translation =
        translations[lang];


      if(!translation){
        return;
      }


      document
        .querySelectorAll(".lang-btn")
        .forEach(btn => {

          btn.classList.remove(
            "active"
          );

        });


      if(button){

        button.classList.add(
          "active"
        );

      }


      Object.keys(
        translation
      ).forEach(key => {

        const element =
          document.getElementById(key);


        if(element){

          element.textContent =
            translation[key];

        }

      });


      if(lang === "cz"){

        document.documentElement.lang =
          "cs";

      }


      if(lang === "en"){

        document.documentElement.lang =
          "en";

      }


      if(lang === "sk"){

        document.documentElement.lang =
          "sk";

      }


      localStorage.setItem(
        "stavitoLanguage",
        lang
      );

    }


    /* =========================================
       NAČTENÍ ULOŽENÉHO JAZYKA
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function(){

        const savedLanguage =
          localStorage.getItem(
            "stavitoLanguage"
          ) || "cz";


        const button =
          document.querySelector(
            '.lang-btn[data-lang="' +
            savedLanguage +
            '"]'
          );


        setLang(
          savedLanguage,
          button
        );

      }
    );


    /* =========================================
       ANIMACE PŘI SCROLLU
    ========================================= */

    const revealElements =
      document.querySelectorAll(
        ".reveal"
      );


    const revealObserver =
      new IntersectionObserver(

        entries => {

          entries.forEach(
            entry => {

              if(
                entry.isIntersecting
              ){

                entry.target
                  .classList
                  .add("show");

                revealObserver
                  .unobserve(
                    entry.target
                  );

              }

            }
          );

        },

        {
          threshold:.10
        }

      );


    revealElements.forEach(
      element => {

        revealObserver.observe(
          element
        );

      }
    );


    /* =========================================
       OCHRANA PŘI CHYBĚJÍCÍ FOTOGRAFII
    ========================================= */

    document
      .querySelectorAll(
        ".gallery-item img"
      )
      .forEach(image => {

        image.addEventListener(
          "error",
          function(){

            this.parentElement
              .style.display =
              "none";

          }
        );

      });


  </script>

</body>

</html>
